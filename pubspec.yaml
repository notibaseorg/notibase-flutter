name: notibase_flutter
# 60–180 characters. Over the ceiling pub.dev docks ten points and truncates
# it in search results anyway, which is the only place most people will ever
# read it.
description: >-
  Notibase for Flutter: push notifications, in-app messages, an in-app inbox
  and campaign attribution — pass the firebase_messaging token and the rest
  is one call.
version: 0.9.0
homepage: https://notibase.dev/flutter.html
repository: https://github.com/notibaseorg/notibase-flutter
issue_tracker: https://github.com/notibaseorg/notibase-flutter/issues
documentation: https://notibase.dev/flutter.html

# Five is the maximum, and `topic:` is a filter people actually browse with.
# Every one of these is a canonical topic that already exists on pub.dev —
# inventing one puts the package in a list of one, which helps nobody.
topics:
  - push-notifications
  - notifications
  - fcm
  - firebase
  - messaging

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Two dependencies, and each one buys something this package cannot do in
  # Dart (Arch §8.2).
  #
  # Device-id persistence.
  shared_preferences: ^2.2.0
  # Google Play's install referrer, which is the ONLY thing that can carry a
  # campaign click into an Android store install — the listing drops every
  # other parameter. Reading it needs Android code, so this is the one place
  # the package stopped being pure Dart, and it is worth it: without it every
  # customer had to add this same plugin themselves and remember to call us.
  # Android-only; it is never touched on any other platform.
  play_install_referrer: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # test-only: HMAC for the e2e's identity-verification checks
  crypto: ^3.0.0
